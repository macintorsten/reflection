name: CI

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with: 
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
    
    - name: Install Playwright browsers
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"
    
    - name: Run tests with Maven
      run: mvn clean verify
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with: 
        name: test-results
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
    
    - name: Upload Playwright screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-screenshots
        path: target/playwright-screenshots/
    
    # Auto-merge Dependabot PRs (currently disabled)
    # Uncomment the steps below to automatically merge Dependabot PRs that pass all tests
